hostname leaf1
password zebra
enable password zebra

interface eth1
 ip address 10.0.0.1/31
exit

interface eth2
 ip address 10.0.0.5/31
exit

interface lo
 ip address 11.11.11.11/32
exit

router ospf
 ospf router-id 11.11.11.11
 network 10.0.0.0/31 area 0
 network 10.0.0.4/31 area 0
 network 11.11.11.11/32 area 0
exit

line vty
