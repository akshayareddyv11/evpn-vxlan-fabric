hostname leaf2
password zebra
enable password zebra

interface eth1
 ip address 10.0.0.3/31
exit

interface eth2
 ip address 10.0.0.7/31
exit

interface lo
 ip address 22.22.22.22/32
exit

router ospf
 ospf router-id 22.22.22.22
 network 10.0.0.2/31 area 0
 network 10.0.0.6/31 area 0
 network 22.22.22.22/32 area 0
exit

line vty
